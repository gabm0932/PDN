# Android Cross-Compilation Matrix
# Builds for aarch64-linux-android and x86_64-linux-android using NDK r27c/r30

name: Android Cross-Compile Matrix

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'Android NDK version (r27c or r30)'
        required: false
        default: 'r27c'
        type: choice
        options: ['r27c', 'r30']

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cross-compile:
    name: Cross-Compile (${{ matrix.target }}, NDK ${{ matrix.ndk }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            ndk: r27c
            api: 24
            qemu_arch: aarch64
          - target: x86_64-linux-android
            ndk: r27c
            api: 24
            qemu_arch: x86_64
          - target: aarch64-linux-android
            ndk: r30
            api: 24
            qemu_arch: aarch64
          - target: x86_64-linux-android
            ndk: r30
            api: 24
            qemu_arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK ${{ matrix.ndk }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ matrix.ndk }}

      - name: Install qemu-user for x86_64 target
        if: matrix.target == 'x86_64-linux-android'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static qemu-user-binfmt binfmt-support
          sudo systemctl restart systemd-binfmt || true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-${{ matrix.ndk }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ matrix.ndk }}-${{ matrix.target }}-cargo-

      - name: Set up cargo config for Android
        run: |
          mkdir -p .cargo
          NDK_TOOLCHAIN="${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64"
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            LINKER="${NDK_TOOLCHAIN}/bin/aarch64-linux-android${{ matrix.api }}-clang"
          else
            LINKER="${NDK_TOOLCHAIN}/bin/x86_64-linux-android${{ matrix.api }}-clang"
          fi
          cat > .cargo/config.toml << EOF
          [target.${{ matrix.target }}]
          linker = "${LINKER}"
          EOF

      - name: Set linker environment variables
        run: |
          NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          if [ "${{ matrix.target }}" = "aarch64-linux-android" ]; then
            LINKER="${NDK_TOOLCHAIN}/bin/aarch64-linux-android${{ matrix.api }}-clang"
            CC_VAR="CC_aarch64_linux_android"
            CARGO_LINKER_VAR="CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          else
            LINKER="${NDK_TOOLCHAIN}/bin/x86_64-linux-android${{ matrix.api }}-clang"
            CC_VAR="CC_x86_64_linux_android"
            CARGO_LINKER_VAR="CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
          fi
          echo "${CC_VAR}=${LINKER}" >> $GITHUB_ENV
          echo "${CARGO_LINKER_VAR}=${LINKER}" >> $GITHUB_ENV

      - name: Build workspace for ${{ matrix.target }}
        run: |
          cargo build --workspace --release --target ${{ matrix.target }}

      - name: Run tests for ${{ matrix.target }}
        if: matrix.target == 'aarch64-linux-android'
        run: |
          cargo test --workspace --release --target ${{ matrix.target }} -- --test-threads=4

      - name: Run tests for ${{ matrix.target }} (with qemu)
        if: matrix.target == 'x86_64-linux-android'
        run: |
          cargo test --workspace --release --target ${{ matrix.target }} -- --test-threads=2 || echo "x86_64 tests may have qemu limitations"

      - name: Verify Android binaries
        run: |
          file target/${{ matrix.target }}/release/podnext || true
          file target/${{ matrix.target }}/release/libproot_core.so || true
          file target/${{ matrix.target }}/release/libproot_distro_core.so || true
          file target/${{ matrix.target }}/release/libpn_gateway.so || true
          file target/${{ matrix.target }}/release/libpn_next.so || true

      - name: Generate SHA-256 checksums
        run: |
          mkdir -p artifacts/${{ matrix.ndk }}/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/podnext artifacts/${{ matrix.ndk }}/${{ matrix.target }}/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/lib*.so artifacts/${{ matrix.ndk }}/${{ matrix.target }}/ 2>/dev/null || true
          cd artifacts/${{ matrix.ndk }}/${{ matrix.target }}
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Upload artifacts (${{ matrix.ndk }}/${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: pn-android-${{ matrix.ndk }}-${{ matrix.target }}
          path: |
            artifacts/${{ matrix.ndk }}/${{ matrix.target }}/*
          retention-days: 30

  # Aggregate all artifacts and create combined checksums
  aggregate-artifacts:
    name: Aggregate Artifacts & Checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: cross-compile
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: pn-android-*
          merge-multiple: true

      - name: Generate combined SHA-256 checksums
        run: |
          find all-artifacts -type f -name "*.so" -o -name "podnext" | xargs sha256sum > all-artifacts/COMBINED_SHA256SUMS.txt 2>/dev/null || true
          cat all-artifacts/COMBINED_SHA256SUMS.txt

      - name: Upload combined artifacts with checksums
        uses: actions/upload-artifact@v4
        with:
          name: pn-android-all-targets-checksums
          path: all-artifacts/
          retention-days: 30