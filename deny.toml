# cargo-deny configuration for PDN (evidence-based, not `cargo deny init` output).
#
# Every license id in `allow` was derived from the resolved dependency graph:
#   cargo metadata --locked --format-version 1   (477 packages)
# and the distinct `license` expressions were extracted + counted. The `/`
# (deprecated OR) forms such as "MIT/Apache-2.0" are parsed by cargo-deny with
# `allow_slash_as_or_operator = true`, so they need no clarifications.
#
# `oci-spec 0.1.0` has no `license` SPDX field (metadata reports UNKNOWN) but
# ships `license-file = "LICENSE"` (MIT text) — cargo-deny detects it from the
# file, so no clarify entry is needed.
#
# Schema note: with cargo-deny >= 0.17 the advisories keys `vulnerability` and
# `notice` were REMOVED (EmbarkStudios/cargo-deny#611) and referencing them is a
# hard config error, and `unmaintained` is now a scope (`all|workspace|transitive|none`),
# not a lint level. This file therefore uses the current schema:
#   * vulnerabilities are always `deny` (no key to soften them)
#   * `unmaintained = "all"` -> reported as warnings (non-fatal)
#   * `yanked = "deny"`      -> fatal

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
yanked = "deny"

# Accepted advisories, by exposure analysis rather than by force-upgrade.
#
# `cargo audit` over the committed lockfile reports 35 advisories: 16 vulnerability
# entries (10 distinct IDs, 6 duplicated across two major versions), 13 unsound and
# 6 unmaintained. Everything accepted below is a `vulnerability`-level entry that
# was judged not reachable, or reachable only by a hostile peer; the accepted set
# stays visible in the audit trail and is tracked for remediation in issue #24.
#
# Where the vulnerable code actually lives (`cargo tree -i`, locked, on this
# revision):
#   * rustls 0.21.12 / 0.22.4 and their rustls-webpki 0.101.7 / 0.102.8 are pulled
#     by tokio-rustls 0.24.1/0.25.0 and by tonic 0.11.0 -> pn-next. That is the
#     gRPC/TLS surface of the daemon, not the `podnext` CLI. Fixed versions
#     (rustls 0.23.46, rustls-webpki 0.103.16, h2 0.4.20) are ALREADY in the graph
#     under newer parents, so removing the old ones requires a tonic/hyper/axum
#     migration, not a `cargo update`.
#   * h2 0.3.27 comes from hyper 0.14.32 via axum 0.6.20 and hyper-timeout 0.4.1
#     (tonic 0.11.0) — same surface.
#   * ruzstd 0.8.3 is in Cargo.lock but has ZERO occurrences in the build graph
#     (`cargo tree` does not contain it): a lock-only entry, no compiled exposure.
#     This is why an audit of the lockfile overstates reachability.
#   * zstd 0.12.4 -> zstd-safe 6.0.6 IS a direct dependency of proot-distro-core
#     and is used to compress/decompress container layers and backups. The unsound
#     advisories there concern APIs we do not call (CCtx::try_clone,
#     train_from_buffer, CParameter::StableInBuffer, init_using_cdict); the one
#     vulnerability-level entry (RUSTSEC-2026-0403) needs a *legacy* frame whose
#     streaming decompression fails, and is listed below as accepted.
#
# `cargo deny check advisories` treats unmaintained and unsound findings as errors
# in this schema (`unmaintained = "all"`, `unsound = "all"`), so every pre-existing
# one has to be accepted explicitly here — otherwise the gate is permanently red and
# hides genuinely new findings. Each entry below is accepted by exposure analysis and
# tracked for remediation in issue #24.
#
# Removing an entry is what tightens the gate: any NEW advisory of any class fails
# the job, because the checks stay enabled.
#
# Verified on CI run 41768674636: with the vulnerability IDs accepted, the summary
# line was `advisories FAILED, bans ok, licenses ok, sources ok` — the only failures
# left were these unsound/unmaintained entries, i.e. the ignore mechanism works and
# the license/bans/sources gates pass as configured.
ignore = [
    # ---------- vulnerabilities (see the analysis above) ----------
    "RUSTSEC-2026-0258", # h2: unbounded empty DATA frames
    "RUSTSEC-2026-0346", # rustls: Debug impls expose TLS secrets
    "RUSTSEC-2026-0349", # rustls: unauthenticated ServerHello downgrade
    "RUSTSEC-2026-0104", # rustls-webpki: panic parsing a CRL (CRL checking unused)
    "RUSTSEC-2026-0382", # rustls-webpki: may accept distrusted intermediates
    "RUSTSEC-2026-0099", # rustls-webpki: wildcard name constraints
    "RUSTSEC-2026-0098", # rustls-webpki: URI name constraints
    "RUSTSEC-2026-0049", # rustls-webpki: faulty CRL matching logic
    "RUSTSEC-2026-0403", # zstd-safe: uninit memory on failed legacy-frame decompress
    # NOTE: RUSTSEC-2026-0344 (ruzstd) is deliberately NOT listed. ruzstd is not in
    # the build graph, so the advisory is not detected; if a future change pulls the
    # crate in, it must fail here rather than be pre-accepted.

    # ---------- unsound (12) ----------
    # zstd-safe 6.0.6 — APIs this workspace does not call. All eight disappear with
    # the `zstd` 0.12 -> 0.13+ bump (remediation step 1 in #24).
    "RUSTSEC-2026-0395", # use-after-free with CParameter::StableInBuffer
    "RUSTSEC-2026-0397", # OutBuffer::around_pos exposes uninitialized memory
    "RUSTSEC-2026-0399", # use-after-free via init_using_cdict / init_using_ddict
    "RUSTSEC-2026-0400", # use-after-free of a dictionary after a one-shot call
    "RUSTSEC-2026-0401", # out-of-bounds read in train_from_buffer
    "RUSTSEC-2026-0402", # heap buffer overflow in CCtx::try_clone
    "RUSTSEC-2026-0404", # double free in DCtx::try_clone
    "RUSTSEC-2026-0406", # use-after-free changing a multithreaded context
    # git2 0.18.3 — the gitops path; fixed by the git2 0.19+ bump (#24 step 4).
    "RUSTSEC-2026-0183", # UB calling Remote::list()
    "RUSTSEC-2026-0008", # UB dereferencing Buf
    "RUSTSEC-2026-0184", # UB with Signature from a buffer-created BlameHunk
    # lexical-core 0.7.6 / pprof 0.12.1 — transitive, unused code paths in our builds.
    "RUSTSEC-2023-0086", # lexical-core: multiple soundness issues
    "RUSTSEC-2024-0408", # pprof: unsound slice::from_raw_parts

    # ---------- unmaintained (4 detected) ----------
    "RUSTSEC-2026-0370", # zvariant — merged into zbus 6; migration tracked in #24
    "RUSTSEC-2026-0372", # zvariant_derive — same announcement
    "RUSTSEC-2025-0134", # rustls-pemfile — superseded by rustls-pki-types
    "RUSTSEC-2024-0449", # unsafe-libyaml — yaml path; no fix published upstream
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
