# cargo-deny configuration for PDN (evidence-based, not `cargo deny init` output).
#
# Every license id in `allow` was derived from the resolved dependency graph:
#   cargo metadata --locked --format-version 1   (477 packages)
# and the distinct `license` expressions were extracted + counted. The `/`
# (deprecated OR) forms such as "MIT/Apache-2.0" are parsed by cargo-deny with
# `allow_slash_as_or_operator = true`, so they need no clarifications.
#
# `oci-spec 0.1.0` has no `license` SPDX field (metadata reports UNKNOWN) but
# ships `license-file = "LICENSE"` (MIT text) — cargo-deny detects it from the
# file, so no clarify entry is needed.
#
# Schema note: with cargo-deny >= 0.17 the advisories keys `vulnerability` and
# `notice` were REMOVED (EmbarkStudios/cargo-deny#611) and referencing them is a
# hard config error, and `unmaintained` is now a scope (`all|workspace|transitive|none`),
# not a lint level. This file therefore uses the current schema:
#   * vulnerabilities are always `deny` (no key to soften them)
#   * `unmaintained = "all"` -> reported as warnings (non-fatal)
#   * `yanked = "deny"`      -> fatal

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "NCSA",
    "GPL-2.0-or-later",
    "LGPL-2.1-or-later",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
