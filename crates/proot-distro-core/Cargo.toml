[package]
name = "proot-distro-core"
version.workspace = true
edition.workspace = true
description = "PRoot Distro Core - Container management for PRoot"
license.workspace = true
repository.workspace = true

[dependencies]
proot-core = { path = "../proot-core" }
proot-compat = { path = "../proot-compat" }
async-trait = "0.1"
libc = "0.2"
nix = { version = "0.27", features = ["mount", "process"] }
rustix = "0.38"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
tempfile = "3.0"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
bzip2 = "0.4"
xz2 = "0.1"
zstd = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
urlencoding = "2.1"
hex = "0.4"
oci-spec = "0.10"
toml = "0.8"
memmap2 = "0.9"
parking_lot = "0.12"
ring = "0.17"
pem = "1.0"
x509-parser = "0.11"
base64 = "0.22"
hmac = "0.12"